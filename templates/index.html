<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ESG Reporting Helper</title>
</head>
<body>
    <h1>Enter Company Details</h1>
    <form method="post">
        <label>Company Name:<br><input type="text" name="name"></label><br>
        <label>Industry:<br><input type="text" name="industry"></label><br>
        <label>Country:<br><input type="text" name="country"></label><br>
        <label>Scope of Reporting:<br><input type="text" name="scope"></label><br>
        <label>Key Stakeholders:<br><textarea name="stakeholders"></textarea></label><br>
        <label>Known Impacts:<br><textarea name="impacts"></textarea></label><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
